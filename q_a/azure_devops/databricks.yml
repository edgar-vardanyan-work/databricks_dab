# This is a Databricks asset bundle definition for azure_devops.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: azure_devops
  uuid: 8d47632e-4f6e-4c4a-9a56-ac3841065de2

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405616057825245.5.azuredatabricks.net
    variables:
      catalog: dbx_dev_ws
      schema: ${workspace.current_user.short_name}
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://adb-7405616057825245.5.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/edgar_vardanyan@epam.com to make sure we only have a single copy.
      root_path: /Workspace/Users/edgar_vardanyan@epam.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dbx_dev_ws
      schema: prod
    permissions:
      - user_name: edgar_vardanyan@epam.com
        level: CAN_MANAGE
