# The main pipeline for azure_devops

resources:
  pipelines:
    azure_devops_etl:
      name: azure_devops_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      root_path: "../src/azure_devops_etl"

      libraries:
        - glob:
            include: ../src/azure_devops_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
